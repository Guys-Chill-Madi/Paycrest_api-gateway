name: Paycrest API Gateway CI/CD

on:
  push:
    branches: [ "test", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MANDATORY: Enter version (e.g., v1.2.3)'
        required: true

jobs:
  security-and-validation:
    name: Security Scan Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt


      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor


      - name: Build Local Image for Scanning
        run: docker build -t local-test-image:${{ github.sha }} .

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  release-to-production:
    name: Build and Push to Docker Hub
    if: github.event_name == 'workflow_dispatch'
    needs: security-and-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Validate Version Tag
        id: tag_check
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          
          if [ -z "$RAW_TAG" ]; then
            echo "ERROR: No tag provided."
            exit 1
          fi

          # Regex: Strictly vMAJOR.MINOR.PATCH (e.g., v1.2.3)
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '$RAW_TAG' is invalid. Tag must be vMAJOR.MINOR.PATCH (e.g. v1.0.0)."
            exit 1
          fi
          
          echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest

  notifications:
    name: Notifications
    needs: [security-and-validation, release-to-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ (needs.security-and-validation.result == 'success' && (needs.release-to-production.result == 'success' || needs.release-to-production.result == 'skipped')) && '✅ Success' || '❌ Failure' }}: Paycrest Pipeline"
          to: ${{ secrets.DEVELOPMENT_TEAM_EMAIL }}
          from: GitHub Actions CI
          body: |
            Pipeline Execution Report
            --------------------------
            Repo: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Ref: ${{ github.ref_name }}
            
            Job Status:
            - Security Scans: ${{ needs.security-and-validation.result }}
            - Docker Release: ${{ needs.release-to-production.result }}
            
            Log URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}