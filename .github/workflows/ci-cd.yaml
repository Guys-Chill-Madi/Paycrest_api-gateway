name: Paycrest API Gateway CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "main" ] 
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MANDATORY: Enter version (e.g., v1.2.3)'
        required: true


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-validation:
    name: Security Scan Pipeline
    if: |
      (github.event_name == 'push' && github.ref_name == 'test') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor

      - name: Build Local Image for Scanning
        run: docker build -t local-scan:${{ github.sha }} .

      - name: Trivy FS Scan (Critical Only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  release-to-production:
    name: Build and Push to Docker Hub
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Version Tag
        id: tag_check
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Final Build and Scan
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }} .

      - name: Trivy Critical Check
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }} ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest

  notifications:
    name: Notifications
    needs: [security-and-validation, release-to-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Detailed Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline Report: ${{ github.repository }} [${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && 'FAILED' || 'SUCCESS' }}]"
          to: ${{ secrets.DEVELOPMENT_TEAM_EMAIL }}
          from: GitHub Actions Robot
          body: |
            ### Paycrest Pipeline Execution Report ###
            
            SUMMARY:
            --------------------------------------------
            Status: ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && '❌ FAILURE' || '✅ SUCCESS' }}
            Event: ${{ github.event_name }}
            Initiated By: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
            
            JOB STATUS:
            --------------------------------------------
            - Security/Snyk/Trivy: ${{ needs.security-and-validation.result || 'SKIPPED' }}
            - Docker Release: ${{ needs.release-to-production.result || 'SKIPPED' }}
            
            LINKS:
            --------------------------------------------
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}