name: Paycrest API Gateway CI/CD

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MANDATORY: Enter version (e.g., v1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-validation:
    name: Security Scan Pipeline
    if: |
      (github.event_name == 'push' && github.ref_name == 'test') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor

      - name: Build Local Image for Scanning
        run: docker build -t local-scan:${{ github.sha }} .

      - name: Trivy FS Scan (Critical Only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  release-to-production:
    name: Build and Push to Docker Hub
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Version Tag
        id: tag_check
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Tag Format. Please use v1.0.0"
            exit 1
          fi
          echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Final Build and Scan
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }} .

      - name: Trivy Critical Check
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }} ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest

  notifications:
    name: Notifications
    needs: [security-and-validation, release-to-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Detailed Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Paycrest CI/CD: ${{ github.repository }} | Status: ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && 'FAILED' || 'SUCCESS' }}"
          to: ${{ secrets.DEVELOPMENT_TEAM_EMAIL }}
          from: "Paycrest Automation <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <div style="font-family: Arial, sans-serif; max-width: 600px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px;">
              <h2 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px;">Pipeline Execution Report</h2>
              
              <table style="width: 100%; margin-top: 20px;">
                <tr>
                  <td><strong>Status:</strong></td>
                  <td>
                    <span style="padding: 4px 8px; border-radius: 4px; color: white; background-color: ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && '#e74c3c' || '#27ae60' }};">
                      ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && 'FAILED' || 'SUCCESS' }}
                    </span>
                  </td>
                </tr>
                <tr><td><strong>Repository:</strong></td><td>${{ github.repository }}</td></tr>
                <tr><td><strong>Triggered By:</strong></td><td>${{ github.actor }}</td></tr>
                <tr><td><strong>Event:</strong></td><td>${{ github.event_name }}</td></tr>
                <tr><td><strong>Branch:</strong></td><td>`${{ github.ref_name }}`</td></tr>
              </table>

              <h3 style="color: #2c3e50; margin-top: 25px;">Job Breakdown</h3>
              <ul style="list-style-type: none; padding-left: 0;">
                <li style="padding: 8px; background: #f9f9f9; margin-bottom: 5px;">🛡️ <strong>Security Scan:</strong> ${{ needs.security-and-validation.result || 'SKIPPED' }}</li>
                <li style="padding: 8px; background: #f9f9f9; margin-bottom: 5px;">🐳 <strong>Production Release:</strong> ${{ needs.release-to-production.result || 'SKIPPED' }}</li>
              </ul>

              <div style="margin-top: 30px; text-align: center;">
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                   style="background-color: #3498db; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">
                   View Full Logs in GitHub
                </a>
              </div>
              
              <p style="font-size: 12px; color: #7f8c8d; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px;">
                This is an automated message from the Paycrest CI/CD system. Please do not reply.
              </p>
            </div>
