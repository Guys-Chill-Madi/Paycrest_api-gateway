name: Paycrest API Gateway CI/CD

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "main" ] # This triggers the security scan for the merge check
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MANDATORY: Enter version (e.g., v1.2.3)'
        required: true

jobs:
  security-and-validation:
    name: Security Scan Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor

      - name: Build Local Image for Scanning
        run: docker build -t local-scan:${{ github.sha }} .

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  release-to-production:
    name: Build and Push to Docker Hub
    # STRICT RULE: This job ONLY runs on manual trigger
    if: github.event_name == 'workflow_dispatch'
    needs: security-and-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Version Tag
        id: tag_check
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must be vMAJOR.MINOR.PATCH (e.g., v1.0.1)"
            exit 1
          fi
          echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:${{ env.FINAL_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/paycrest-api-gateway:latest

  notifications:
    name: Notifications
    needs: [security-and-validation, release-to-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline Report: ${{ github.repository }}"
          to: ${{ secrets.DEVELOPMENT_TEAM_EMAIL }}
          from: GitHub Actions CI
          body: |
            Pipeline Execution Report
            --------------------------
            Event: ${{ github.event_name }}
            Security Scan: ${{ needs.security-and-validation.result }}
            Docker Release: ${{ needs.release-to-production.result }}